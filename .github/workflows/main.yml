name: Setup and package four platforms

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  setup-package:
    name: Setup ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-arm64
            runner: windows-11-arm
            msvc_arch: amd64_arm64
            arch: arm64
            agent: j2c_agent.dll
          - platform: windows-x64
            runner: windows-2022
            msvc_arch: amd64
            arch: x64
            agent: j2c_agent.dll
          - platform: ubuntu-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            agent: j2c_agent.so
          - platform: ubuntu-x64
            runner: ubuntu-24.04
            arch: x64
            agent: j2c_agent.so
    env:
      J2C_ARCH: ${{ matrix.arch }}
      UV_PYTHON: '3.13'
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          architecture: ${{ matrix.arch }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install uv
        run: python -m pip install uv
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Select Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
          $bashDir = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $bashDir 'bash.exe'))) {
            throw "Git Bash missing under $gitRoot"
          }
          $bashDir >> $env:GITHUB_PATH
      # Capstone may need a source build on Windows ARM64. Its Python build
      # uses CMake/NMake, which requires the MSVC environment and target SDK.
      - name: Set up Windows C/C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Check Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($tool in @('cmake.exe', 'nmake.exe', 'cl.exe', 'link.exe')) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Host "$tool -> $($command.Source)"
          }
          if ($env:VSCMD_ARG_TGT_ARCH -ne $env:J2C_ARCH) {
            throw "MSVC target '$env:VSCMD_ARG_TGT_ARCH' does not match '$env:J2C_ARCH'"
          }
      - name: Run complete Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -Force
      - name: Run complete Ubuntu setup
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/setup.sh --force
      - name: Verify setup and archive entire project
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_AGENT: ${{ matrix.agent }}
        run: python scripts/package_setup.py
      - name: Upload platform ZIP
        uses: actions/upload-artifact@v4
        with:
          name: c2j-${{ matrix.platform }}
          path: ${{ runner.temp }}/c2j-packages/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish four ZIPs as pre-release
    needs: setup-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: c2j-*
          path: release-assets
          merge-multiple: true
      - name: Check four packages
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-arm64 windows-x64 ubuntu-arm64 ubuntu-x64; do
            test -s "release-assets/c2j-native-deobfuscator-$platform.zip"
          done
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: setup-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Setup packages (${{ github.run_number }})
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/*.zip
