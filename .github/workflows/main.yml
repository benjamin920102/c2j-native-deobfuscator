name: Build CLI tools only

on:
  workflow_dispatch:

jobs:
  build-cli:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: gradle

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          set-default: false

      - name: Configure Gradle Java toolchains
        shell: powershell
        run: |
          if (-not $env:JAVA_HOME_17_X64 -or -not $env:JAVA_HOME_21_X64) {
            throw "setup-java did not provision both JDKs (JAVA_HOME_17_X64 / JAVA_HOME_21_X64)"
          }
          $jdk17 = $env:JAVA_HOME_17_X64.Replace('\', '/')
          $jdk21 = $env:JAVA_HOME_21_X64.Replace('\', '/')

          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null

          @"
          org.gradle.java.installations.auto-detect=true
          org.gradle.java.installations.auto-download=false
          org.gradle.java.installations.paths=$jdk17,$jdk21
          "@ | Set-Content "$env:USERPROFILE\.gradle\gradle.properties"

      - name: Build CLI distributions
        working-directory: jvm
        shell: powershell
        run: .\gradlew.bat installDist --no-daemon

      - name: Archive entire project without .git
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist_package" -Force

          Get-ChildItem -Path . -Force |
            Where-Object {
              $_.Name -ne ".git" -and
              $_.Name -ne "dist_package" -and
              $_.Name -ne "project.zip" -and
              $_.Name -ne "c2j-native-deobfuscator.zip"
            } |
            Copy-Item -Destination "dist_package" -Recurse -Force

          Compress-Archive `
            -Path "dist_package\*" `
            -DestinationPath "c2j-native-deobfuscator.zip"

      - name: Generate Tag Name
        id: tag
        shell: powershell
        run: |
          $tagName = "cli-" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "CLI Tools Pre-release (${{ steps.tag.outputs.TAG_NAME }})"
          prerelease: true
          files: c2j-native-deobfuscator.zip
